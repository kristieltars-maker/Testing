# Nginx server block for the original Acoustic Matcher MVP on
# correction-audio.bot-atelier.ru, protected by the ecosystem SSO gate.
#
# The MVP container is unchanged and listens on 127.0.0.1:8081. Access is
# gated by nginx `auth_request` against the `testing` loopback endpoint
# `GET /api/internal/session` (shared secret in the X-Internal-Auth header).
# Unauthenticated users are redirected to the common ecosystem login.
#
# Install:
#   cp /opt/audio-correction-mvp/deploy/nginx-mvp.conf \
#      /etc/nginx/sites-available/correction-audio.bot-atelier.ru
#   ln -sf /etc/nginx/sites-available/correction-audio.bot-atelier.ru \
#          /etc/nginx/sites-enabled/correction-audio.bot-atelier.ru
#   nginx -t && systemctl reload nginx
#
# TLS: the existing certificate for correction-audio.bot-atelier.ru is
# reused. This file only defines the HTTP :80 server; Certbot already owns
# the `listen 443 ssl` server and the HTTP -> HTTPS redirect (see the managed
# placeholder at the bottom). Do NOT hand-edit certificate paths.
#
# Deploy-time substitution: deploy-mvp.sh replaces the SSO token placeholder
# in the X-Internal-Auth header below with the shared secret. That secret
# MUST match INTERNAL_AUTH_TOKEN in `testing` (see testing deploy config).

server {
    listen 80;
    server_name correction-audio.bot-atelier.ru;

    # 50 MB max per file plus multipart overhead.
    client_max_body_size 60M;

    # --- SSO gate ---------------------------------------------------------
    auth_request /_sso;
    error_page 401 403 = @sso_login;

    location = /_sso {
        internal;
        proxy_pass http://127.0.0.1:3000/api/internal/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Internal-Auth "<INTERNAL_AUTH_TOKEN>";
    }

    location @sso_login {
        return 302 https://bot-atelier.ru/login?next=https%3A%2F%2Fcorrection-audio.bot-atelier.ru%2F;
    }

    # --- Unmodified MVP application --------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
    }
}

