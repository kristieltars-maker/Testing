# Nginx server block for the ecosystem portal (bot-atelier.ru).
#
# Install:
#   cp /opt/portal/nginx.conf /etc/nginx/sites-available/bot-atelier.ru
#   ln -sf /etc/nginx/sites-available/bot-atelier.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS is managed by Certbot (placeholder at the bottom of this file).
#
# NOTE: the login page of the ecosystem lives here as well: GET /login
# serves the SPA shell of `testing` (Vite dist), while /api/ is proxied
# to the same backend. Assets under /assets/ and /favicon.svg belong to
# the testing frontend; the portal's own icon is /portal-favicon.svg.

server {
    listen 80;
    server_name bot-atelier.ru www.bot-atelier.ru;

    root /opt/portal;
    index index.html;

    # 50 MB — совпадает с лимитом корректора.
    client_max_body_size 60M;

    # index.html — без кэша (обновления подхватываются сразу).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    # Каталог подсистем и проверка сессии — без длинного кэша.
    location = /subsystems.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /auth-state.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Страница входа — SPA статики приложения testing.
    location = /login {
        root /opt/testing-bots/frontend/dist;
        try_files /index.html =404;
    }
    location = /login/ {
        return 301 /login;
    }

    # Страница «Пользователи» — SPA статики приложения testing на apex.
    location /admin/ {
        root /opt/testing-bots/frontend/dist;
        try_files /index.html =404;
    }

    # Иконка страницы входа (public/ сборки testing).
    location = /favicon.svg {
        root /opt/testing-bots/frontend/dist;
    }

    location ^~ /api/internal/ {
        deny all;
        return 403;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA-ассеты сборки testing (login-страница).
    location /assets/ {
        root /opt/testing-bots/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Certbot (управляется certbot --nginx) ---
    # listen 443 ssl; # managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/bot-atelier.ru/fullchain.pem; # managed by Certbot
    # ssl_certificate_key /etc/letsencrypt/live/bot-atelier.ru/privkey.pem; # managed by Certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
